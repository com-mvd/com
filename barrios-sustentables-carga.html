<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#16213e">
<title>Carga Barrios Sustentables</title>
<link rel="icon" type="image/png" href="assets/logo-ciemsa.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
/* Página de carga de Barrios Sustentables: Cerro. No está en la portada: se entra por link.
   Escribe en la planilla "Validación Barrios Sustentables" a través de su Apps Script, con la
   clave de carga (se pide una vez y queda en este navegador). */
:root{
  --bg:#F7F6F3; --card:#FFFFFF; --border:#E6E2DA;
  --text:#1A1714; --text2:#5F5A54; --text3:#9A948C;
  --azul:#1b3f74; --rojo:#c0392b; --verde:#1baf7a;
  --shadow:0 4px 20px rgba(26,23,20,.05),0 1px 3px rgba(26,23,20,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;background:var(--bg);min-height:100vh}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

.barra{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#0f172a 0%,#16213e 55%,#1b3f74 100%);color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top)}
.barra-in{max-width:560px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:10px}
.barra h1{font-family:'Segoe UI',Arial,sans-serif;font-size:19px;font-weight:700;line-height:1.2;flex:1}
.barra a{color:#fff;font-size:13px;font-weight:600;opacity:.85;text-decoration:none;border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:5px 11px;white-space:nowrap}

.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:16px}
.card h2{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2 .acc{margin-left:auto;font-size:13px;font-weight:600;color:var(--azul);background:none;border:0;cursor:pointer}

label.l{display:block;font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px}
label.l:first-of-type{margin-top:0}
.in{width:100%;font-size:16px;padding:12px 13px;border:1px solid var(--border);border-radius:11px;background:#fff;outline:none}
.in:focus{border-color:var(--azul);box-shadow:0 0 0 3px rgba(27,63,116,.12)}

/* Edificio: tres botones grandes */
.lugares{display:grid;gap:8px}
.lugar{display:flex;align-items:center;gap:10px;text-align:left;padding:12px 13px;border:1.5px solid var(--border);border-radius:12px;background:#fff;font-size:15px;font-weight:600;cursor:pointer}
.lugar i{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.lugar.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff)}

/* Bolsones: − número + */
.contador{display:flex;align-items:center;gap:10px}
.contador button{width:52px;height:52px;border-radius:12px;border:1px solid var(--border);background:#fff;font-size:26px;font-weight:600;cursor:pointer;flex:none}
.contador input{text-align:center;font-size:22px;font-weight:700}

.botones{display:flex;gap:8px;margin-top:18px}
.btn{flex:1;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(135deg,#0f172a 0%,#16213e 55%,#1b3f74 100%)}
.btn:disabled{opacity:.55;cursor:default}
.btn.sec{flex:0 0 auto;background:#fff;color:var(--text2);border:1px solid var(--border)}

/* Lista de cargas */
.fila{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid #EFECE6}
.fila:first-child{border-top:0}
.fila i{width:11px;height:11px;border-radius:50%;background:var(--c);flex:none}
.fila .t{flex:1;min-width:0}
.fila .t b{display:block;font-size:14.5px}
.fila .t span{font-size:13px;color:var(--text2)}
.fila .n{font-size:18px;font-weight:700;min-width:28px;text-align:center}
.fila .n.cero{color:var(--text3)}
.fila .acc{display:flex;gap:6px}
.fila .acc button{border:1px solid var(--border);background:#fff;border-radius:9px;padding:7px 10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text2)}
.fila .acc button.borrar{color:var(--rojo)}
.fila.editando{background:#F3F6FB;margin:0 -16px;padding-left:16px;padding-right:16px}
.vacio{color:var(--text3);font-size:14px;text-align:center;padding:10px}
.mas{display:block;width:100%;margin-top:8px;border:1px solid var(--border);background:#fff;border-radius:10px;padding:10px;font-size:14px;font-weight:600;color:var(--text2);cursor:pointer}

/* Aviso abajo */
.aviso{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100% - 32px);background:#1A1714;color:#fff;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:20}
.aviso.error{background:var(--rojo)}

/* Pantalla de la clave */
.clave-caja{max-width:360px;margin:12vh auto 0;text-align:center}
.clave-caja p{font-size:14px;color:var(--text2);margin:6px 0 16px}
.clave-caja .err{color:var(--rojo);font-size:13px;font-weight:600;min-height:1.2em;margin-top:10px}
.cargando{text-align:center;color:var(--text2);padding:30px 0;font-size:14px}
</style>
</head>
<body>

<header class="barra">
  <div class="barra-in">
    <h1>Carga · Barrios Sustentables</h1>
    <a href="barrios-sustentables-cerro.html">Ver tablero</a>
  </div>
</header>

<!-- Clave de carga: se pide una sola vez por navegador -->
<div class="wrap" id="pantallaClave" hidden>
  <form class="card clave-caja" id="formClave">
    <h2 style="justify-content:center">Clave de carga</h2>
    <p>Se pide una sola vez en este celular.</p>
    <input class="in" id="inClave" type="password" autocomplete="current-password" placeholder="Clave" autocapitalize="off" spellcheck="false">
    <div class="botones"><button class="btn" type="submit">Entrar</button></div>
    <div class="err" id="errClave"></div>
  </form>
</div>

<div class="wrap" id="pantallaCarga" hidden>
  <form class="card" id="form">
    <h2 id="tituloForm">Nueva carga</h2>

    <label class="l">Edificio</label>
    <div class="lugares" id="lugares"></div>

    <label class="l" for="inDir">Dirección</label>
    <input class="in" id="inDir" type="text" autocomplete="off">

    <label class="l" for="inFecha">Fecha y hora del vaciado</label>
    <input class="in num" id="inFecha" type="datetime-local" required>

    <label class="l" for="inCant">Bolsones</label>
    <div class="contador">
      <button type="button" id="menos" aria-label="Uno menos">−</button>
      <input class="in num" id="inCant" type="number" inputmode="numeric" min="0" max="999" step="1" required>
      <button type="button" id="mas" aria-label="Uno más">+</button>
    </div>

    <div class="botones">
      <button class="btn sec" type="button" id="cancelar" hidden>Cancelar</button>
      <button class="btn" type="submit" id="guardar">Guardar</button>
    </div>
  </form>

  <section class="card">
    <h2>Cargados <button class="acc" type="button" id="refrescar">Actualizar</button></h2>
    <div id="lista"><div class="cargando">Cargando…</div></div>
    <button class="mas" type="button" id="verMas" hidden>Ver más</button>
  </section>
</div>

<div class="aviso" id="aviso" hidden></div>

<script>
// Aplicación web del Apps Script "Barrios Sustentables - Validación" (Desktop/IA/barrios-sustentables)
const API_URL = 'https://script.google.com/macros/s/AKfycbwgeDkIdZ6AUPGR_4dQS3Z24QTRThqk_9qDoi-1NTPiySEqbty06Bmo7E4U2b-KS9Em1g/exec';
// Los mismos tres puntos que barrios-sustentables-cerro.html y el Apps Script
const LUGARES = [
  { nombre: 'Plaza Débora Céspedes', dir: 'EGIPTO esq. SUECIA', color: '#1baf7a' },
  { nombre: 'Federación FOICA', dir: 'HOLANDA 1715', color: '#2a78d6' },
  { nombre: 'Plaza de Deportes N11', dir: 'PORTUGAL esq. AUSTRIA', color: '#eb6834' },
];
const GUARDADA = 'com.barrios.claveCarga';
const POR_PAGINA = 15;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const colorDe = nombre => (LUGARES.find(l => l.nombre === nombre) || {}).color || '#B5AFA6';
// "2026-11-04T14:30" → "04/11/2026 14:30"
const fLinda = s => s ? `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(0, 4)} ${s.slice(11, 16)}` : 'Sin fecha';
// Ahora en Montevideo, en el formato del campo de fecha
const ahora = () => new Date().toLocaleString('sv-SE', { timeZone: 'America/Montevideo' }).slice(0, 16).replace(' ', 'T');

let clave = null, filas = [], editando = null, mostrar = POR_PAGINA, lugarElegido = null;

function leerClave() { try { return localStorage.getItem(GUARDADA); } catch { return null; } }
function guardarClave(c) { try { c ? localStorage.setItem(GUARDADA, c) : localStorage.removeItem(GUARDADA); } catch { } }

let avisoT;
function aviso(texto, error = false) {
  $('aviso').textContent = texto;
  $('aviso').className = 'aviso' + (error ? ' error' : '');
  $('aviso').hidden = false;
  clearTimeout(avisoT); avisoT = setTimeout(() => $('aviso').hidden = true, error ? 5000 : 2500);
}

// Todo va por POST con texto plano (sin consulta previa del navegador); la clave va en el cuerpo
async function pedir(datos) {
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ clave, ...datos }) });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const r = await res.json();
  if (!r.ok && r.error === 'clave') { guardarClave(null); clave = null; pantalla('clave'); throw new Error('Clave de carga incorrecta'); }
  if (!r.ok) throw new Error(r.error || 'Error');
  filas = r.filas;
  dibujarLista();
  return r;
}

function pantalla(cual) {
  $('pantallaClave').hidden = cual !== 'clave';
  $('pantallaCarga').hidden = cual !== 'carga';
  if (cual === 'clave') setTimeout(() => $('inClave').focus(), 50);
}

// ── Formulario ──────────────────────────────────────────────────────────────
function dibujarLugares() {
  $('lugares').innerHTML = LUGARES.map((l, i) => `<button type="button" class="lugar${lugarElegido === l.nombre ? ' on' : ''}" style="--c:${l.color}" data-i="${i}"><i></i>${esc(l.nombre)}</button>`).join('');
  $('lugares').querySelectorAll('button').forEach(b => b.onclick = () => {
    const l = LUGARES[+b.dataset.i];
    // La dirección se completa sola si estaba vacía o era la de otro punto
    if (!$('inDir').value || LUGARES.some(x => x.dir === $('inDir').value)) $('inDir').value = l.dir;
    lugarElegido = l.nombre;
    dibujarLugares();
  });
}

function limpiarForm() {
  editando = null;
  lugarElegido = null;
  $('inDir').value = '';
  $('inFecha').value = ahora();
  $('inCant').value = 1;
  $('tituloForm').textContent = 'Nueva carga';
  $('guardar').textContent = 'Guardar';
  $('cancelar').hidden = true;
  dibujarLugares();
  dibujarLista();
}

function editar(f) {
  editando = f;
  lugarElegido = f.edif;
  $('inDir').value = f.dir;
  $('inFecha').value = f.fGes;
  $('inCant').value = f.cant ?? 0;
  $('tituloForm').textContent = 'Editar carga';
  $('guardar').textContent = 'Guardar cambios';
  $('cancelar').hidden = false;
  dibujarLugares();
  dibujarLista();
  $('form').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

$('menos').onclick = () => $('inCant').value = Math.max(0, (parseInt($('inCant').value, 10) || 0) - 1);
$('mas').onclick = () => $('inCant').value = Math.min(999, (parseInt($('inCant').value, 10) || 0) + 1);
$('cancelar').onclick = limpiarForm;

$('form').onsubmit = async e => {
  e.preventDefault();
  if (!lugarElegido) return aviso('Elegí el edificio', true);
  const cant = parseInt($('inCant').value, 10);
  if (!$('inFecha').value) return aviso('Falta la fecha y hora', true);
  if (!(cant >= 0)) return aviso('Falta la cantidad de bolsones', true);
  const fila = { edif: lugarElegido, dir: $('inDir').value.trim(), fGes: $('inFecha').value.slice(0, 16), cant };
  $('guardar').disabled = true;
  try {
    if (editando) {
      await pedir({ accion: 'editar', n: editando.n, antes: { edif: editando.edif, fGes: editando.fGes, cant: editando.cant }, fila });
      aviso('Cambios guardados');
    } else {
      await pedir({ accion: 'agregar', fila });
      aviso('Carga guardada');
    }
    limpiarForm();
  } catch (err) {
    aviso(err.message, true);
  } finally {
    $('guardar').disabled = false;
  }
};

// ── Lista ───────────────────────────────────────────────────────────────────
function dibujarLista() {
  // De la más nueva a la más vieja (por fecha del vaciado)
  const orden = [...filas].sort((a, b) => (b.fGes || '').localeCompare(a.fGes || '') || b.n - a.n);
  const ver = orden.slice(0, mostrar);
  $('lista').innerHTML = ver.length ? ver.map(f => `<div class="fila${editando && editando.n === f.n ? ' editando' : ''}" style="--c:${colorDe(f.edif)}">
      <i></i>
      <div class="t"><b>${esc(f.edif || 'Sin edificio')}</b><span class="num">${fLinda(f.fGes)}</span></div>
      <div class="n num${f.cant ? '' : ' cero'}">${f.cant ?? '–'}</div>
      <div class="acc"><button type="button" data-n="${f.n}" data-a="e">Editar</button><button type="button" class="borrar" data-n="${f.n}" data-a="b">Borrar</button></div>
    </div>`).join('') : '<div class="vacio">Todavía no hay cargas</div>';
  $('verMas').hidden = orden.length <= mostrar;
  $('lista').querySelectorAll('button').forEach(b => b.onclick = async () => {
    const f = filas.find(x => x.n === +b.dataset.n);
    if (!f) return;
    if (b.dataset.a === 'e') return editar(f);
    if (!confirm(`¿Borrar la carga de ${f.edif}, ${fLinda(f.fGes)}, ${f.cant ?? 0} bolsones?`)) return;
    b.disabled = true;
    try {
      await pedir({ accion: 'borrar', n: f.n, antes: { edif: f.edif, fGes: f.fGes, cant: f.cant } });
      if (editando && editando.n === f.n) limpiarForm();
      aviso('Carga borrada');
    } catch (err) {
      aviso(err.message, true);
      b.disabled = false;
    }
  });
}
$('verMas').onclick = () => { mostrar += POR_PAGINA; dibujarLista(); };
$('refrescar').onclick = async () => {
  try { await pedir({ accion: 'listar' }); aviso('Lista actualizada'); } catch (err) { aviso(err.message, true); }
};

// ── Inicio ──────────────────────────────────────────────────────────────────
$('formClave').onsubmit = async e => {
  e.preventDefault();
  const c = $('inClave').value.trim();
  if (!c) return;
  $('errClave').textContent = '';
  clave = c;
  try {
    pantalla('carga');
    await pedir({ accion: 'listar' });
    guardarClave(c);
  } catch (err) {
    clave = null;
    pantalla('clave');
    $('errClave').textContent = err.message;
  }
};

async function iniciar() {
  limpiarForm();
  clave = leerClave();
  if (!clave) return pantalla('clave');
  pantalla('carga');
  try { await pedir({ accion: 'listar' }); }
  catch (err) { if (clave) $('lista').innerHTML = `<div class="vacio">No se pudo leer la planilla (${esc(err.message)})</div>`; }
}
iniciar();
</script>
</body>
</html>
